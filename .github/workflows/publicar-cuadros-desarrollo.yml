name: Publicar catálogo AR en desarrollo

on:
  push:
    branches:
      - desarrollo/multicuadros-ar-v2
    paths:
      - proyectos/por-publicar.json
      - 'proyectos/pendientes/*.json'

permissions:
  contents: write

concurrency:
  group: publicar-cuadros-desarrollo
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtener rama de desarrollo
        uses: actions/checkout@v4
        with:
          ref: desarrollo/multicuadros-ar-v2
          persist-credentials: true
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Identificar solicitud de publicación
        id: solicitud
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(git show --pretty=format: --name-only "$GITHUB_SHA" | grep -E '^proyectos/pendientes/[a-z0-9-]+[.]json$' | head -1 || true)
          if [[ -n "$FILE" ]]; then
            test -f "$FILE"
            echo "archivo=$FILE" >> "$GITHUB_OUTPUT"
            echo "modo=agregar" >> "$GITHUB_OUTPUT"
            echo "Solicitud nueva: $FILE"
          elif git show --pretty=format: --name-only "$GITHUB_SHA" | grep -qx 'proyectos/por-publicar.json'; then
            echo "archivo=proyectos/por-publicar.json" >> "$GITHUB_OUTPUT"
            echo "modo=reemplazar" >> "$GITHUB_OUTPUT"
          else
            echo "No se detectó ningún archivo publicable en el commit." >&2
            exit 1
          fi
      - name: Validar y convertir archivos del proyecto
        shell: bash
        env:
          PROJECT_FILE: ${{ steps.solicitud.outputs.archivo }}
          PROJECT_MODE: ${{ steps.solicitud.outputs.modo }}
        run: |
          set -euo pipefail
          if [[ "$PROJECT_MODE" == "agregar" ]]; then
            node scripts/preparar-publicacion-ar.mjs "$PROJECT_FILE" --apply --append
          else
            node scripts/preparar-publicacion-ar.mjs "$PROJECT_FILE" --apply
          fi
      - name: Instalar herramientas AR
        run: |
          mkdir -p .ar-tools
          npm install --prefix .ar-tools --no-package-lock --no-save mind-ar@1.2.5 sharp@0.34.4
          cp scripts/compilar-objetivos-ar.mjs .ar-tools/compilar.mjs
          cp scripts/optimizar-imagenes-ar.mjs .ar-tools/optimizar.mjs
      - name: Optimizar PNG
        run: node .ar-tools/optimizar.mjs
      - name: Compilar reconocimiento
        run: node .ar-tools/compilar.mjs
      - name: Validar archivos listos para publicar
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          const base='public/prototipo-ar/';
          const p=JSON.parse(fs.readFileSync(base+'catalogo.json','utf8'));
          if(!Array.isArray(p.cuadros)||!p.cuadros.length||p.cuadros.length>30)throw Error('Catálogo incorrecto');
          if(p.archivoMind!=='./targets.mind'||!fs.existsSync(base+'targets.mind'))throw Error('Falta .mind');
          for(const art of p.cuadros){
            if(!fs.existsSync(base+art.imagenObjetivo.slice(2)))throw Error('Referencia inexistente: '+art.id);
            for(const layer of art.capas)if(!fs.existsSync(base+layer.imagen.slice(2)))throw Error('Falta capa: '+layer.id);
          }
          "
      - name: Confirmar SOLO en rama de desarrollo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/prototipo-ar
          if git diff --cached --quiet; then
            echo "Los archivos AR ya están actualizados."
          else
            git commit -m "Publicar nuevas imágenes AR optimizadas solo en desarrollo"
            for intento in 1 2 3; do
              git fetch origin desarrollo/multicuadros-ar-v2
              git rebase FETCH_HEAD
              if git push origin HEAD:desarrollo/multicuadros-ar-v2; then exit 0; fi
            done
            echo "La publicación requiere resolver cambios simultáneos." >&2
            exit 1
          fi
