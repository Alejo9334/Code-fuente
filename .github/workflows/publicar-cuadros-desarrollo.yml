name: Publicar catálogo AR en desarrollo

on:
  push:
    branches:
      - desarrollo/multicuadros-ar-v2
    paths:
      - proyectos/por-publicar.json
      - 'proyectos/pendientes/*.json'

permissions:
  contents: write

concurrency:
  group: publicar-cuadros-desarrollo
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener rama de desarrollo
        uses: actions/checkout@v4
        with:
          ref: desarrollo/multicuadros-ar-v2
          persist-credentials: true
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Identificar solicitud de publicación
        id: solicitud
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(git show --pretty=format: --name-only "$GITHUB_SHA" | grep -E '^proyectos/pendientes/[a-z0-9-]+\.json
      - name: Instalar compilador MindAR en entorno aislado
        run: |
          mkdir -p .ar-tools
          npm install --prefix .ar-tools --no-package-lock --no-save mind-ar@1.2.5 sharp@0.34.4
          cp scripts/compilar-objetivos-ar.mjs .ar-tools/compilar.mjs
          cp scripts/optimizar-imagenes-ar.mjs .ar-tools/optimizar.mjs
      - name: Optimizar PNG para publicar versiones livianas
        run: node .ar-tools/optimizar.mjs
      - name: Precompilar reconocimiento de todos los cuadros
        run: node .ar-tools/compilar.mjs
      - name: Validar catálogo publicado y estructura
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          const base='public/prototipo-ar/';
          const p=JSON.parse(fs.readFileSync(base+'catalogo.json','utf8'));
          if(!p.cuadros.length)throw Error('Catálogo vacío');
          for(const art of p.cuadros){
            if(!fs.existsSync(base+art.imagenObjetivo.slice(2)))throw Error('Falta imagen objetivo: '+art.id);
            for(const layer of art.capas)if(!fs.existsSync(base+layer.imagen.slice(2)))throw Error('Falta PNG: '+layer.id);
          }
          "
      - name: Confirmar publicación SOLO en desarrollo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/prototipo-ar
          if git diff --cached --quiet; then
            echo "No hay cambios en el catálogo AR"
          else
            git commit -m "Publicar cuadros AR y objetivos precompilados en desarrollo"
            for intento in 1 2 3; do
              git fetch origin desarrollo/multicuadros-ar-v2
              git rebase FETCH_HEAD
              if git push origin HEAD:desarrollo/multicuadros-ar-v2; then exit 0; fi
            done
            exit 1
          fi
 | head -1 || true)
          if [[ -n "$FILE" ]]; then
            test -f "$FILE"
            echo "archivo=$FILE" >> "$GITHUB_OUTPUT"
            echo "modo=agregar" >> "$GITHUB_OUTPUT"
            echo "Solicitud nueva: $FILE"
          elif git show --pretty=format: --name-only "$GITHUB_SHA" | grep -qx 'proyectos/por-publicar.json'; then
            echo "archivo=proyectos/por-publicar.json" >> "$GITHUB_OUTPUT"
            echo "modo=reemplazar" >> "$GITHUB_OUTPUT"
          else
            echo "No se detectó ningún archivo publicable en el commit." >&2
            exit 1
          fi
      - name: Validar y convertir archivos del proyecto
        shell: bash
        run: |
          set -euo pipefail
          FILE="${{ steps.solicitud.outputs.archivo }}"
          if [[ "${{ steps.solicitud.outputs.modo }}" == "agregar" ]]; then
            node scripts/preparar-publicacion-ar.mjs "$FILE" --apply --append
          else
            node scripts/preparar-publicacion-ar.mjs "$FILE" --apply
          fi
      - name: Instalar compilador MindAR en entorno aislado
        run: |
          mkdir -p .ar-tools
          npm install --prefix .ar-tools --no-package-lock --no-save mind-ar@1.2.5 sharp@0.34.4
          cp scripts/compilar-objetivos-ar.mjs .ar-tools/compilar.mjs
          cp scripts/optimizar-imagenes-ar.mjs .ar-tools/optimizar.mjs
      - name: Optimizar PNG para publicar versiones livianas
        run: node .ar-tools/optimizar.mjs
      - name: Precompilar reconocimiento de todos los cuadros
        run: node .ar-tools/compilar.mjs
      - name: Validar catálogo publicado y estructura
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          const base='public/prototipo-ar/';
          const p=JSON.parse(fs.readFileSync(base+'catalogo.json','utf8'));
          if(!p.cuadros.length)throw Error('Catálogo vacío');
          for(const art of p.cuadros){
            if(!fs.existsSync(base+art.imagenObjetivo.slice(2)))throw Error('Falta imagen objetivo: '+art.id);
            for(const layer of art.capas)if(!fs.existsSync(base+layer.imagen.slice(2)))throw Error('Falta PNG: '+layer.id);
          }
          "
      - name: Confirmar publicación SOLO en desarrollo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/prototipo-ar
          if git diff --cached --quiet; then
            echo "No hay cambios en el catálogo AR"
          else
            git commit -m "Publicar cuadros AR y objetivos precompilados en desarrollo"
            for intento in 1 2 3; do
              git fetch origin desarrollo/multicuadros-ar-v2
              git rebase FETCH_HEAD
              if git push origin HEAD:desarrollo/multicuadros-ar-v2; then exit 0; fi
            done
            exit 1
          fi
