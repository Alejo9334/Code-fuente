name: Validar prototipo AR v2
on:
  push:
    branches:
      - desarrollo/multicuadros-ar-v2
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install
      - name: Validar catálogo
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('public/prototipo-ar/catalogo.json','utf8'));
          if(!Array.isArray(data.cuadros) || !data.cuadros.length) throw Error('Catálogo incompleto');
          const indexes=data.cuadros.map(x=>x.targetIndex);
          if(indexes.some(x=>!Number.isInteger(x)||x<0) || new Set(indexes).size!==indexes.length) throw Error('Índices inválidos');
          for(const c of data.cuadros) {
            if(!Array.isArray(c.capas) || !c.id || !c.capas.length) throw Error('Cuadro sin ID o capas');
            if(!data.archivoMind && !c.imagenObjetivo) throw Error('Cuadro sin imagen de referencia');
            if(c.imagenObjetivo && !fs.existsSync('public/prototipo-ar/'+c.imagenObjetivo.replace(/^\.\//,''))) throw Error('Archivo de referencia no encontrado: '+c.imagenObjetivo);
            for(const layer of c.capas) {
              if(!fs.existsSync('public/prototipo-ar/'+layer.imagen.replace(/^\.\//,''))) throw Error('Capa faltante: '+layer.imagen);
            }
          }
          console.log('Catálogo validado:',data.cuadros.length,'cuadros');
          "
      - name: Compilar Vite
        run: npm run build
      - name: Comprobar visor generado
        run: test -f dist/prototipo-ar/preparar-imagen.html && test -f dist/prototipo-ar/optimizar.html && test -f dist/prototipo-ar/optimizacion-imagenes.json && test -f dist/prototipo-ar/index.html && test -f dist/prototipo-ar/catalogo.json && test -f dist/prototipo-ar/crear-cuadro.html && test -f dist/prototipo-ar/editor.html && test -f dist/prototipo-ar/login.html && test -f dist/prototipo-ar/admin-auth.js && test -f dist/prototipo-ar/auth-config.js
      - name: Validar scripts de prueba
        run: node scripts/verificar-prototipo-ar.mjs
      - name: Preparar publicación de muestra sin alterar catálogo
        run: |
          node scripts/preparar-publicacion-ar.mjs proyectos/ejemplo-publicacion.json
          test -f tmp/ar-publicacion-revision/catalogo.json
          test -f tmp/ar-publicacion-revision/cuadro-original.png.png
          test -f tmp/ar-publicacion-revision/capa-1.png.png
          node --input-type=module -e "
          import fs from 'node:fs';
          const original=JSON.parse(fs.readFileSync('public/prototipo-ar/catalogo.json','utf8'));
          const preview=JSON.parse(fs.readFileSync('tmp/ar-publicacion-revision/catalogo.json','utf8'));
          if(preview.cuadros.length!==1 || preview.cuadros[0].id!=='cuadro-creeper-001') throw Error('La revisión debe empaquetar solo el cuadro seleccionado');
          if(!original.cuadros.some(art=>art.id==='cuadro-creeper-001')) throw Error('El catálogo original debe conservar el cuadro base');
          "
          git diff --exit-code -- public/prototipo-ar/catalogo.json

      - name: Validar carga incremental sin publicación real
        run: |
          cp public/prototipo-ar/catalogo.json tmp/catalogo-antes-prueba.json
          node scripts/preparar-publicacion-ar.mjs proyectos/ejemplo-agregar-cuadro.json --apply --append
          node --input-type=module -e "
          import fs from 'node:fs';
          const before=JSON.parse(fs.readFileSync('tmp/catalogo-antes-prueba.json','utf8'));
          const data=JSON.parse(fs.readFileSync('public/prototipo-ar/catalogo.json','utf8'));
          if(data.cuadros.length!==before.cuadros.length+1)throw Error('La incorporación debe conservar todos los cuadros existentes y añadir uno');
          before.cuadros.forEach((art,index)=>{
            if(data.cuadros[index].id!==art.id||data.cuadros[index].targetIndex!==index)throw Error('Se alteró un cuadro ya registrado');
          });
          const newArt=data.cuadros[before.cuadros.length];
          if(newArt.id!=='prueba-agregado-automatico'||newArt.targetIndex!==before.cuadros.length)throw Error('Nuevo cuadro sin índice correcto');
          const art=newArt;
          if(!fs.existsSync('public/prototipo-ar/'+art.imagenObjetivo.replace(/^\\.\\//,'')))throw Error('Falta referencia del nuevo cuadro');
          for(const layer of art.capas)if(!fs.existsSync('public/prototipo-ar/'+layer.imagen.replace(/^\\.\\//,'')))throw Error('Falta capa del nuevo cuadro');
          console.log('Proyecto incremental generado correctamente; sin publicación a clientes.');
          "
