<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050b1c">
  <title>Visor-222 · Escanear cuadros</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body, #stage { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050b1c; }
    #stage { position: fixed; inset: 0; }
    #stage a-scene, #stage canvas { width: 100% !important; height: 100% !important; }
    /* La cámara ocupa toda el área segura del teléfono, sin controles laterales. */
    html, body { min-height: 100dvh; overscroll-behavior: none; }
    #stage { height: 100dvh; }
    #stage a-scene, #stage canvas { touch-action: none; }
    .hud { position: fixed; z-index: 50; pointer-events: none; color: white; }
    #top { top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    #top .top-actions { display: flex; gap: 8px; align-items: center; }
    #immersive { display: none; color: white; background: #071b35c9; border: 1px solid #ffffff55; border-radius: 12px; box-shadow: none; padding: 9px 12px; min-height: 42px; font-size: 13px; font-weight: 650; backdrop-filter: blur(12px); }
    body.running #immersive { display: inline-flex; align-items: center; justify-content: center; }
    body.immersive #top .brand { opacity: .45; }
    body.immersive #bottom #message { opacity: 0; transform: translateY(14px); pointer-events: none; }
    #bottom #message { transition: opacity .3s, transform .3s; }
    body.immersive #bottom { bottom: max(10px, env(safe-area-inset-bottom)); }
    body.immersive #stop { padding: 10px 18px; font-size: 12px; opacity: .7; }
    .brand { font-size: 16px; letter-spacing: .02em; font-weight: 750; text-shadow: 0 2px 12px #000; }
    .pill { padding: 8px 11px; border: 1px solid #ffffff40; border-radius: 999px; background: #06132cbb; backdrop-filter: blur(12px); font-size: 12px; }
    #reticle { left: 50%; top: 49%; transform: translate(-50%,-50%); width: min(68vw, 290px); aspect-ratio: 4/3; border: 2px solid #8dd3ff99; border-radius: 24px; box-shadow: 0 0 0 999px #00000025; transition: opacity .3s; }
    #reticle::before, #reticle::after { content: ""; position: absolute; width: 34px; height: 34px; border: 4px solid #6ed6ff; border-radius: 12px; }
    #reticle::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
    #reticle::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
    #reticle { pointer-events: none; }
    #recognitionPulse { position: fixed; z-index: 45; left: 50%; top: 49%; width: min(68vw,290px); aspect-ratio: 4/3; transform: translate(-50%,-50%) scale(.94); border: 2px solid #6df4ff; border-radius: 24px; opacity: 0; pointer-events: none; box-shadow: 0 0 25px #54d8ff99, inset 0 0 30px #54d8ff33; }
    #recognitionLabel { position: absolute; left: 50%; bottom: -44px; transform: translateX(-50%); padding: 8px 13px; border-radius: 100px; white-space: nowrap; font-size: 12px; background: #06192bec; color: #d8faff; border: 1px solid #83edff99; }
    #recognitionPulse.active { animation: recognitionGlow 1.05s ease-out both; }
    @keyframes recognitionGlow {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(.88); }
      25% { opacity: 1; transform: translate(-50%,-50%) scale(1.03); }
      75% { opacity: .9; }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.15); }
    }
    #bottom { bottom: max(20px, env(safe-area-inset-bottom)); left: 18px; right: 18px; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
    #message { max-width: 430px; padding: 12px 16px; border-radius: 16px; background: #08172ddd; backdrop-filter: blur(12px); border: 1px solid #ffffff25; font-size: 13px; line-height: 1.45; }
    button { pointer-events: auto; appearance: none; border: 0; border-radius: 14px; padding: 14px 24px; font: inherit; font-size: 15px; font-weight: 750; background: #5dd4ff; color: #072034; box-shadow: 0 8px 28px #0006; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    #stop { display: none; color: white; border: 1px solid #ffffff40; background: #15283fd9; }
    #overlay { position: fixed; inset: 0; z-index: 40; background: radial-gradient(circle at 50% 38%, #122f54 0, #050b1c 70%); display: flex; align-items: center; justify-content: center; padding: 24px; color: white; }
    #overlay .panel { max-width: 470px; text-align: center; display: grid; gap: 16px; justify-items: center; }
    h1 { font-size: clamp(27px, 7vw, 38px); line-height: 1.1; margin: 0; }
    p { margin: 0; color: #b6cee8; line-height: 1.55; }
    #overlay .hint { font-size: 12px; }
    #stage .a-enter-vr, #stage .a-enter-ar { display: none !important; }
    body.running #overlay { display: none; }
    body:not(.running) #reticle { opacity: 0; }
    body.detected #reticle { opacity: 0; }
    body:not(.running) #stop { display: none; }
    body.running #stop { display: inline-block; }
    @media (prefers-reduced-motion: reduce) {
      #reticle, #bottom #message { transition: none; }
      #recognitionPulse.active { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="stage" aria-label="Visor de realidad aumentada"></div>
  <div id="overlay">
    <div class="panel">
      <div style="font-size:52px" aria-hidden="true">🖼️</div>
      <h1>La magia está frente a ti</h1>
      <p>Activa tu cámara y observa cómo las imágenes cobran vida ante tus ojos.</p>
      <p id="count">Cargando catálogo de cuadros…</p>
      <button id="start" disabled>Activar cámara</button>
      <p class="hint">Sin QR · Sin instalación · Requiere permiso de cámara y conexión HTTPS</p>
    </div>
  </div>
  <div class="hud" id="top"><span class="brand">VISOR<span style="color:#5dd4ff">·222</span></span><div class="top-actions"><span class="pill" id="state">Preparando</span><button id="immersive" aria-pressed="false" aria-label="Activar vista inmersiva">⛶ <span id="immersiveLabel">Pantalla completa</span></button></div></div>
  <div class="hud" id="reticle" aria-hidden="true"></div>
  <div id="recognitionPulse" aria-hidden="true"><span id="recognitionLabel">✓ Imagen reconocida</span></div>
  <div class="hud" id="bottom">
    <span id="message" role="status" aria-live="polite">Prepara el cuadro frente a la cámara.</span>
    <button id="stop">Cerrar cámara</button>
  </div>
<script>
(function () {
  'use strict';
  var stage = document.getElementById('stage');
  var startButton = document.getElementById('start');
  var stopButton = document.getElementById('stop');
  var status = document.getElementById('state');
  var message = document.getElementById('message');
  var count = document.getElementById('count');
  var immersiveButton=document.getElementById('immersive');
  var immersiveLabel=document.getElementById('immersiveLabel');
  var recognitionPulse=document.getElementById('recognitionPulse');
  var motionReduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var pulseTimer=null;
  var scene = null;
  var ready = false;
  var tracked = new Set();
  var catalog = null;
  var generatedMindUrl = null;
  var texturesReady = false;
  var assetsPromise = null;

  function say(text, short) {
    message.textContent = text;
    status.textContent = short || text;
  }

  function pulseRecognition(){
    recognitionPulse.classList.remove('active');
    void recognitionPulse.offsetWidth;
    recognitionPulse.classList.add('active');
    clearTimeout(pulseTimer);
    pulseTimer=setTimeout(function(){recognitionPulse.classList.remove('active');},motionReduced?850:1100);
  }

  function immersiveState(enabled) {
    document.body.classList.toggle('immersive',enabled);
    immersiveButton.setAttribute('aria-pressed',String(enabled));
    immersiveButton.setAttribute('aria-label',enabled?'Salir de vista inmersiva':'Activar vista inmersiva');
    immersiveLabel.textContent=enabled?'Salir de inmersión':'Pantalla completa';
  }
  immersiveButton.addEventListener('click',async function(){
    var enabled=!document.body.classList.contains('immersive');
    immersiveState(enabled);
    if(enabled&&document.documentElement.requestFullscreen){
      try {await document.documentElement.requestFullscreen({navigationUI:'hide'});}
      catch(err){console.info('Pantalla completa del navegador no disponible; sigue vista inmersiva.',err);}
    } else if(!enabled&&document.fullscreenElement&&document.exitFullscreen){
      try{await document.exitFullscreen();}catch(err){console.info(err);}
    }
  });
  document.addEventListener('fullscreenchange',function(){
    if(!document.fullscreenElement&&document.body.classList.contains('immersive')){
      // El usuario también puede salir del fullscreen desde el sistema.
      immersiveState(false);
    }
  });

  function element(tag, attributes) {
    var node = document.createElement(tag);
    Object.keys(attributes || {}).forEach(function (key) { node.setAttribute(key, attributes[key]); });
    return node;
  }

  // Sprites PNG verdaderamente transparentes para la demostración, creados en canvas.
  // Los cuadros reales usarán archivos .png propios y no esta función.
  function demoPng(type) {
    var canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 320;
    var ctx = canvas.getContext('2d');
    if (type === 'halo') {
      var glow = ctx.createRadialGradient(256, 160, 12, 256, 160, 218);
      glow.addColorStop(0, 'rgba(72,221,255,.40)');
      glow.addColorStop(.55, 'rgba(74,152,255,.25)');
      glow.addColorStop(1, 'rgba(74,152,255,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, 512, 320);
      ctx.strokeStyle = 'rgba(133,231,255,.75)';
      ctx.lineWidth = 7;
      ctx.beginPath(); ctx.ellipse(256,160,204,122,0,0,Math.PI*2); ctx.stroke();
    } else {
      [[100,84,12],[410,105,16],[190,265,10],[315,50,12],[378,246,9]].forEach(function(p) {
        var x=p[0], y=p[1], r=p[2];
        ctx.fillStyle='rgba(255,239,171,.95)';
        ctx.beginPath();ctx.moveTo(x,y-r*1.7);ctx.lineTo(x+r*.3,y-r*.3);
        ctx.lineTo(x+r*1.7,y);ctx.lineTo(x+r*.3,y+r*.3);
        ctx.lineTo(x,y+r*1.7);ctx.lineTo(x-r*.3,y+r*.3);
        ctx.lineTo(x-r*1.7,y);ctx.lineTo(x-r*.3,y-r*.3);ctx.closePath();ctx.fill();
      });
    }
    return canvas.toDataURL('image/png');
  }

  function validCatalog(data) {
    if (!data || !Array.isArray(data.cuadros) || !data.cuadros.length) {
      throw new Error('El catálogo debe incluir archivoMind y al menos un cuadro.');
    }
    var ids = new Set(), indexes = new Set();
    data.cuadros.forEach(function (art) {
      if (!art.id || !Number.isInteger(art.targetIndex) || art.targetIndex < 0 || !Array.isArray(art.capas)) {
        throw new Error('Cada cuadro necesita id, targetIndex y capas.');
      }
      if (ids.has(art.id) || indexes.has(art.targetIndex)) throw new Error('Hay IDs o targetIndex duplicados.');
      ids.add(art.id); indexes.add(art.targetIndex);
    });
    if (!data.archivoMind && !data.cuadros.every(function(art){return typeof art.imagenObjetivo === 'string' && !!art.imagenObjetivo;})) {
      throw new Error('Falta archivoMind o imagenObjetivo en todos los cuadros.');
    }
    return data;
  }

  function assetSource(source) {
    if (source === 'demo:halo') return demoPng('halo');
    if (source === 'demo:destellos') return demoPng('destellos');
    if (typeof source !== 'string' || !source || /^javascript:/i.test(source)) throw new Error('Ruta de capa no válida');
    return source;
  }

  function createPlane(layer) {
    var x = Number(layer.x || 0), y = Number(layer.y || 0), z = Number(layer.z || 0);
    var w = Number(layer.ancho || 1), h = Number(layer.alto || 1);
    if (![x,y,z,w,h].every(Number.isFinite) || w <= 0 || h <= 0) throw new Error('Medidas de capa no válidas');
    var alpha = Number(layer.opacidad === undefined ? 1 : layer.opacidad);
    var position = [x,y,z].join(' ');
    // Las texturas se adjuntan con THREE directamente, evitando que A-Frame
    // muestre un material blanco mientras intenta resolver #asset-id.
    var degrees = Number(layer.rotation || 0);
    if (!Number.isFinite(degrees)) degrees = 0;
    var plane = element('a-entity', { position: position, rotation: '0 0 ' + degrees });
    plane.userDataLayer = { w: w, h: h, alpha: Math.max(0,Math.min(1,alpha)) };
    var anim = layer.animacion || {};
    var amp = Number(anim.amplitud || 0);
    var dur = Math.max(350, Number(anim.duracionMs || 1800));
    if (anim.tipo === 'flotar' && amp > 0) {
      plane.setAttribute('animation__flotar', 'property: position; from: ' + position + '; to: ' + [x,y+amp,z].join(' ') + '; dur: ' + dur + '; dir: alternate; loop: true; easing: easeInOutSine');
    } else if (anim.tipo === 'pulso' && amp > 0) {
      plane.setAttribute('animation__pulso', 'property: scale; from: 1 1 1; to: ' + [1+amp,1+amp,1].join(' ') + '; dur: ' + dur + '; dir: alternate; loop: true; easing: easeInOutSine');
    } else if (anim.tipo === 'girar' && amp !== 0) {
      plane.setAttribute('animation__girar', 'property: rotation; from: 0 0 0; to: 0 0 ' + amp + '; dur: ' + dur + '; dir: alternate; loop: true; easing: easeInOutSine');
    }
    return plane;
  }

  // Cargar imágenes reales de forma explícita ANTES de habilitar la cámara.
  // Esto garantiza que no existan planos sin textura.
  async function attachPng(plane, layer, order) {
    var src = assetSource(layer.imagen);
    var img = new Image();
    img.crossOrigin = 'anonymous';
    var absoluteUrl = /^data:/i.test(src) ? src : new URL(src, location.href).href;
    await new Promise(function(resolve,reject) {
      img.onload = function(){resolve();};
      img.onerror = function(){reject(new Error('No se pudo cargar la capa PNG: ' + layer.nombre));};
      img.src = absoluteUrl;
    });
    if (typeof img.decode === 'function') {
      try { await img.decode(); } catch(err) { /* onload ya confirmó los píxeles */ }
    }
    var THREE = AFRAME.THREE;
    var texture = new THREE.Texture(img);
    texture.needsUpdate = true;
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.flipY = true;
    var material = new THREE.MeshBasicMaterial({
      map: texture,
      color: 0xffffff,
      transparent: true,
      opacity: plane.userDataLayer.alpha,
      alphaTest: 0.01,
      depthWrite: false,
      side: THREE.DoubleSide,
      toneMapped: false
    });
    var geometry = new THREE.PlaneGeometry(plane.userDataLayer.w,plane.userDataLayer.h);
    var mesh = new THREE.Mesh(geometry, material);
    mesh.renderOrder = order;
    plane.setObject3D('mesh',mesh);
    return true;
  }

  function loadTarget(src) {
    return new Promise(function(resolve,reject) {
      var img = new Image();
      img.onload = function(){resolve(img);};
      img.onerror = function(){reject(new Error('Imagen de referencia dañada.'));};
      img.src = src;
    });
  }

  async function compileLocalTargets(data) {
    var attempts = 0;
    function getCompiler() {
      return window.MINDAR && (window.MINDAR.Compiler || (window.MINDAR.IMAGE && window.MINDAR.IMAGE.Compiler));
    }
    while (!getCompiler() && attempts < 60) {
      await new Promise(function(resolve){setTimeout(resolve,200);}); attempts++;
    }
    if (!getCompiler()) {
      throw new Error('El compilador MindAR no está disponible.');
    }
    var sorted = data.cuadros.slice().sort(function(a,b){return a.targetIndex-b.targetIndex;});
    if(sorted.some(function(art,index){return art.targetIndex!==index;})) {
      throw new Error('Los índices targetIndex deben empezar en 0 sin saltos.');
    }
    say('Preparando imágenes de reconocimiento…', 'Preparando');
    var images = await Promise.all(sorted.map(function(art){return loadTarget(art.imagenObjetivo);}));
    say('Analizando las imágenes de los cuadros…', 'Compilando');
    var compiler = new (getCompiler())();
    await compiler.compileImageTargets(images, function(progress){
      say('Compilando imágenes de reconocimiento: '+Math.round(progress)+'%', 'Compilando');
    });
    var bytes = await compiler.exportData();
    var blob = new Blob([bytes], {type:'application/octet-stream'});
    generatedMindUrl = URL.createObjectURL(blob);
    return generatedMindUrl;
  }

  async function prepareScene(data) {
    var targetSrc = null;
    // El catálogo publicado usa los descriptores .mind precompilados.
    // Los borradores con imágenes nuevas continúan con el compilador local.
    if(data.archivoMind && data.compilador && data.compilador.cantidadObjetivos === data.cuadros.length) {
      var locationMind = new URL(data.archivoMind,location.href);
      try {
        say('Cargando datos de reconocimiento optimizados…', 'Carga rápida');
        var response=await fetch(locationMind.href,{method:'HEAD',cache:'force-cache'});
        if(!response.ok)throw Error('No se encontró el archivo .mind publicado.');
        targetSrc=locationMind.href;
      }catch(err) {
        console.warn('Archivo de reconocimiento precompilado no disponible; compilando en el dispositivo.',err);
        say('Preparando reconocimiento de respaldo…', 'Respaldo');
      }
    }
    if(!targetSrc)targetSrc=await compileLocalTargets(data);
    buildScene(data,targetSrc);
  }

  function buildScene(data, targetSrc) {
    scene = element('a-scene', {
      embedded: '',
      'vr-mode-ui': 'enabled: false',
      'device-orientation-permission-ui': 'enabled: false',
      renderer: 'colorManagement: true; alpha: true; antialias: true',
      'mindar-image': 'imageTargetSrc: ' + new URL(targetSrc, location.href).href +
        '; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; maxTrack: 1'
    });
    scene.style.cssText='position:absolute; inset:0; width:100%; height:100%;';
    var collections = new Map();
    function ensureArtworkAssets(id) {
      var collection=collections.get(id);
      if(!collection) return Promise.reject(new Error('Cuadro desconocido: '+id));
      if(!collection.promise) {
        collection.promise=Promise.all(collection.textures.map(function(item){
          return attachPng(item.plane,item.layer,item.order);
        })).then(function(){collection.loaded=true;}).catch(function(err){
          collection.promise=null;
          console.error('No se pudieron cargar las capas de '+collection.art.nombre,err);
          throw err;
        });
      }
      return collection.promise;
    }
    data.cuadros.forEach(function(art) {
      var target=element('a-entity', {'mindar-image-target': 'targetIndex: ' + art.targetIndex});
      var group={art:art,textures:[],promise:null,loaded:false};
      collections.set(art.id,group);
      target.addEventListener('targetFound', function () {
        tracked.add(art.id);
        document.body.classList.add('detected');
        if(!group.loaded) {
          say('Cuadro reconocido. Cargando sus capas PNG: '+art.nombre,'Cargando capas');
          ensureArtworkAssets(art.id).then(function(){
            if(tracked.has(art.id))say('Experiencia activa: '+art.nombre,'Cuadro reconocido');
          }).catch(function(){
            say('No se pudieron cargar las capas de '+art.nombre+'. Comprueba la conexión.','Error de PNG');
          });
        } else {
          say('Experiencia activa: '+art.nombre,'Cuadro reconocido');
        }
      });
      target.addEventListener('targetLost', function () {
        tracked.delete(art.id);
        if (!tracked.size) {
          document.body.classList.remove('detected');
          say('Mueve suavemente la cámara hasta encontrar un cuadro registrado.', 'Buscando cuadro');
        }
      });
      art.capas.forEach(function (layer,layerIndex) {
        if(layer.visible===false)return;
        var plane=createPlane(layer);
        target.appendChild(plane);
        group.textures.push({plane:plane,layer:layer,order:layerIndex+1});
      });
      scene.appendChild(target);
    });
    scene.appendChild(element('a-camera', {position:'0 0 0', 'look-controls':'enabled: false'}));
    var sceneLoaded=new Promise(function(resolve){
      scene.addEventListener('loaded',resolve,{once:true});
    });
    stage.appendChild(scene);
    assetsPromise=sceneLoaded.then(async function(){
      // Con varios cuadros solo se precargan los PNG de la primera obra.
      // El resto se carga al reconocerlo, reduciendo datos y memoria inicial.
      var first=data.cuadros[0];
      say('Preparando capas iniciales de '+first.nombre+'…','Preparando PNG');
      await ensureArtworkAssets(first.id);
      texturesReady=true;
      ready=true;
      startButton.disabled=false;
      say('Reconocimiento optimizado listo. Activa la cámara.','Listo');
    });
    assetsPromise.catch(function(err){
      console.error(err);
      say('Error cargando PNG iniciales: '+err.message,'Error PNG');
      count.textContent=err.message;
    });
  }

  async function start() {
    if (!ready || !texturesReady || !scene) return;
    if (!window.isSecureContext) { say('La cámara requiere HTTPS o localhost.', 'HTTPS requerido'); return; }
    startButton.disabled=true;
    say('Abriendo cámara…', 'Iniciando');
    try {
      var system=scene.systems['mindar-image-system'];
      if (!system) throw new Error('No se cargó el motor de reconocimiento.');
      await system.start();
      document.body.classList.add('running');
      say('Apunta al cuadro registrado y mantén el teléfono estable.', 'Buscando cuadro');
    } catch(err) {
      console.error(err);
      say('No se pudo iniciar la cámara. Revisa permisos, HTTPS y compatibilidad del navegador.', 'Error de cámara');
    } finally { startButton.disabled=false; }
  }

  async function stop() {
    try { if(scene && scene.systems['mindar-image-system']) await scene.systems['mindar-image-system'].stop(); }
    catch(err) { console.error(err); }
    tracked.clear();
    document.body.classList.remove('running','detected');
    say('Cámara detenida.', 'Listo');
  }

  startButton.addEventListener('click', start);
  stopButton.addEventListener('click', stop);
  window.addEventListener('pagehide', function () { if(scene && scene.systems['mindar-image-system']) scene.systems['mindar-image-system'].stop(); if(generatedMindUrl) URL.revokeObjectURL(generatedMindUrl); });

  // El QR lleva únicamente los parámetros de capa. Los PNG siempre se
  // cargan de los archivos ya publicados; no se transmiten imágenes privadas.
  function applySharedPreview(data, code) {
    if(!code || code.length>4000 || !/^[A-Za-z0-9_-]+$/.test(code)) {
      throw new Error('El enlace QR no es válido.');
    }
    var raw = atob(code.replace(/-/g,'+').replace(/_/g,'/'));
    var packet = JSON.parse(raw);
    if(!Array.isArray(packet) || packet[0]!==1 || typeof packet[1]!=='string' || !Array.isArray(packet[2])) {
      throw new Error('Formato de vista previa no reconocido.');
    }
    var art=data.cuadros.find(function(x){return x.id===packet[1];});
    if(!art)throw new Error('Este cuadro no está registrado en la vista previa.');
    if(packet[2].length>art.capas.length || packet[2].length===0)throw new Error('Cantidad de capas incompatible.');
    var registry=new Map(art.capas.map(function(l){return [l.id,l];}));
    var seen=new Set(), types=['ninguna','flotar','pulso','girar'];
    var layers=packet[2].map(function(row){
      if(!Array.isArray(row) || row.length!==12 || !registry.has(row[0]) || seen.has(row[0])) {
        throw new Error('El enlace contiene capas desconocidas o repetidas.');
      }
      seen.add(row[0]);
      var valid=row.slice(1);
      if(valid.some(function(v){return typeof v!=='number' || !Number.isFinite(v);}))throw new Error('Parámetros de capa inválidos.');
      var x=row[1],y=row[2],z=row[3],w=row[4],h=row[5],rotation=row[6],alpha=row[7],visible=row[8],type=row[9],amp=row[10],dur=row[11];
      if(Math.abs(x)>1 || Math.abs(y)>1 || z<0 || z>1 || w<=0 || w>3 || h<=0 || h>4 ||
         Math.abs(rotation)>360 || alpha<0 || alpha>1 || (visible!==0&&visible!==1) ||
         !Number.isInteger(type) || type<0 || type>3 || amp<0 || amp>90 || dur<350 || dur>20000) {
        throw new Error('El enlace contiene valores fuera de rango.');
      }
      var l=Object.assign({},registry.get(row[0]));
      l.x=x;l.y=y;l.z=z;l.ancho=w;l.alto=h;l.rotation=rotation;
      l.opacidad=alpha;l.visible=!!visible;
      l.animacion={tipo:types[type],amplitud:amp,duracionMs:dur};
      return l;
    });
    art.capas=layers;
    return data;
  }

  function readCameraProject(){
    return new Promise(function(resolve,reject){
      if(!window.indexedDB){reject(Error('Este navegador no permite guardar proyectos grandes.'));return;}
      var request=indexedDB.open('visor222-pruebas-ar',1);
      request.onupgradeneeded=function(){if(!request.result.objectStoreNames.contains('proyectos'))request.result.createObjectStore('proyectos');};
      request.onerror=function(){reject(request.error||Error('No se pudo abrir el proyecto guardado'));};
      request.onsuccess=function(){
        var db=request.result;
        var transaction=db.transaction('proyectos','readonly');
        var query=transaction.objectStore('proyectos').get('visor-actual');
        query.onsuccess=function(){
          var data=query.result;db.close();
          if(!data){reject(Error('El editor aún no ha enviado ningún proyecto AR.'));return;}
          try{resolve(JSON.parse(data));}catch(err){reject(err);}
        };
        query.onerror=function(){db.close();reject(query.error||Error('No se pudo recuperar el proyecto'));};
      };
    });
  }
  var localMode = new URLSearchParams(location.search).get('local');
  var useLocal = localMode === '1' || localMode === 'idb';
  var catalogPromise = localMode === 'idb'
    ? readCameraProject()
    : useLocal
      ? Promise.resolve().then(function(){
          var saved=sessionStorage.getItem('visor222-prototipo-catalogo');
          if(!saved)throw new Error('No hay imágenes cargadas. Regresa al editor.');
          return JSON.parse(saved);
        })
      : fetch('./catalogo.json',{cache:'no-store'}).then(function(res){
          if(!res.ok)throw new Error('No se encontró catalogo.json');return res.json();
        });

  catalogPromise
    .then(async function(data){
      var share=new URLSearchParams(location.search).get('share');
      if(share) {
        data=applySharedPreview(data,share);
        say('Configuración de capas recibida desde el editor del PC.', 'Vista previa QR');
      }
      catalog=validCatalog(data);
      count.textContent=data.cuadros.length + (data.cuadros.length===1?' cuadro registrado':' cuadros registrados') + ' · Sin QR' + (share?' · Ajustes del PC':'');
      await prepareScene(data);
    })
    .catch(function(err) {
      console.error(err);
      count.textContent='Error al cargar el catálogo: ' + err.message;
      say('Corrige catalogo.json para activar el visor.', 'Error de catálogo');
    });
})();
</script>
