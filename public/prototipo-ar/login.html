<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Visor-222 | Acceso administrativo</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;color:#e9f4ff;background:#081120}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
main{max-width:430px;width:100%;background:#101f34;border:1px solid #34506e;border-radius:24px;padding:30px;box-shadow:0 30px 90px #0007}
h1{font-size:27px;margin:5px 0 8px}p{font-size:13px;line-height:1.6;color:#a6bcd5}
label{display:block;font-size:13px;margin:18px 0 7px}input{width:100%;border:1px solid #35506b;border-radius:12px;background:#0a1424;color:#fff;padding:13px;font-size:15px}
button{border:0;background:#5fd4fb;color:#062034;font-weight:800;font-size:15px;padding:14px;border-radius:12px;width:100%;margin-top:22px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}a{color:#76d7ff}#status{min-height:36px}strong{color:#69d9fd}
</style></head>
<body><main><strong>VISOR·222 / ADMINISTRACIÓN</strong><h1>Iniciar sesión</h1>
<p>El editor está reservado para cuentas aprobadas. Los visitantes pueden seguir usando el visor AR sin registrarse.</p>
<form id="login">
<label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required minlength="8">
<button id="submit" type="submit">Acceder al editor</button>
</form><p id="status" role="status" aria-live="polite"></p>
<p><a href="./index.html">Volver al visor público</a></p>
</main>
<script src="./auth-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./admin-auth.js"></script>
<script>
(function(){
  var service=window.VISOR222_ADMIN;
  var msg=document.getElementById('status');
  var button=document.getElementById('submit');
  if(!service.configured()){
    msg.textContent='La autenticación todavía no está configurada. Debes conectar un proyecto Supabase para activar el acceso privado.';
    button.disabled=true;return;
  }
  if(new URLSearchParams(location.search).has('reason'))msg.textContent='Inicia sesión con una cuenta autorizada para administrar cuadros.';
  service.administrator().then(function(user){if(user)location.replace('./editor.html');})
    .catch(function(err){msg.textContent='No se pudo consultar el acceso: '+err.message;});
  document.getElementById('login').addEventListener('submit',async function(event){
    event.preventDefault();button.disabled=true;msg.textContent='Comprobando cuenta y permisos…';
    try{
      await service.signIn(document.getElementById('email').value.trim(),document.getElementById('password').value);
      location.replace('./editor.html');
    }catch(err){msg.textContent=err.message;button.disabled=false;}
  });
})();
</script>
</body></html>
